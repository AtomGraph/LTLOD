[project]
name = "ltlod-etl"
version = "0.1.0"
description = "LTLOD ETL tools: Wikidata reconciliation, image enrichment, scraper framework"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rdflib>=7.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "lxml>=5.0",
    "openpyxl>=3.1",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
ltlod-reconcile = "ltlod_etl.reconcile:main"
ltlod-geo = "ltlod_etl.geo:main"
ltlod-streetkeys = "ltlod_etl.streetkeys:main"
ltlod-declarations = "ltlod_etl.declarations:main"
ltlod-officials = "ltlod_etl.officials:main"
ltlod-elections = "ltlod_etl.elections:main"
ltlod-campaign-finance = "ltlod_etl.campaign_finance:main"
ltlod-facilities = "ltlod_etl.facilities:main"
ltlod-procurement = "ltlod_etl.procurement:main"
ltlod-vtek = "ltlod_etl.vtek:main"
ltlod-sodra = "ltlod_etl.sodra:main"
ltlod-land = "ltlod_etl.land_acquisitions:main"
ltlod-insolvency = "ltlod_etl.insolvency:main"
ltlod-eu-funds = "ltlod_etl.eu_funds:main"
ltlod-taxes = "ltlod_etl.taxes:main"
ltlod-audit = "ltlod_etl.audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ltlod_etl"]
